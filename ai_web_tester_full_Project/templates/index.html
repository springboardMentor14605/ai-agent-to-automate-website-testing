<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Web Testing Agent</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;800&display=swap');

:root {
  --bg: #080b12;
  --surface: #0e1420;
  --surface2: #141c2e;
  --border: #1c2540;
  --accent: #3b82f6;
  --accent-glow: rgba(59,130,246,0.15);
  --green: #22c55e;
  --red: #ef4444;
  --yellow: #eab308;
  --text: #e2e8f0;
  --muted: #64748b;
  --mono: 'Space Mono', monospace;
  --sans: 'Outfit', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  display: grid;
  grid-template-columns: 380px 1fr;
  grid-template-rows: 60px 1fr;
}

/* ─ Topbar ─ */
.topbar {
  grid-column: 1 / -1;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 2rem;
  gap: 1rem;
}

.logo {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-weight: 800;
  font-size: 1rem;
  letter-spacing: -0.02em;
  color: #fff;
}

.logo-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.topbar-sub {
  color: var(--muted);
  font-size: 0.8rem;
  margin-left: auto;
  font-family: var(--mono);
}

/* ─ Sidebar ─ */
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-header {
  padding: 1.5rem 1.5rem 1rem;
  border-bottom: 1px solid var(--border);
}

.sidebar-header h2 {
  font-size: 0.75rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  margin-bottom: 1.2rem;
}

.form-group {
  margin-bottom: 1rem;
}

.form-group label {
  display: block;
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--muted);
  margin-bottom: 0.4rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.form-group input[type="text"],
.form-group textarea {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.65rem 0.8rem;
  color: var(--text);
  font-family: var(--sans);
  font-size: 0.875rem;
  outline: none;
  resize: none;
  transition: border-color 0.2s;
}

.form-group input:focus,
.form-group textarea:focus {
  border-color: var(--accent);
}

.form-group textarea { min-height: 120px; }

.form-toggles {
  display: flex;
  gap: 0.8rem;
  flex-wrap: wrap;
}

.toggle {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.8rem;
  color: var(--muted);
  cursor: pointer;
  user-select: none;
}

.toggle input { accent-color: var(--accent); width: 14px; height: 14px; }

.run-btn {
  width: 100%;
  margin-top: 1rem;
  padding: 0.85rem;
  background: var(--accent);
  border: none;
  border-radius: 8px;
  color: #fff;
  font-family: var(--sans);
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.02em;
  transition: opacity 0.2s, transform 0.1s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
}

.run-btn:hover { opacity: 0.9; }
.run-btn:active { transform: scale(0.98); }
.run-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ─ Job list ─ */
.job-list {
  flex: 1;
  overflow-y: auto;
  padding: 1rem;
}

.job-list-title {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  margin-bottom: 0.8rem;
}

.job-item {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.7rem 1rem;
  margin-bottom: 0.5rem;
  cursor: pointer;
  transition: border-color 0.2s;
}

.job-item:hover { border-color: var(--accent); }
.job-item.active { border-color: var(--accent); background: var(--accent-glow); }

.job-item-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.2rem;
}

.job-id { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); }

.status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.status-dot.queued  { background: var(--yellow); }
.status-dot.running { background: var(--accent); animation: pulse 1s infinite; }
.status-dot.done    { background: var(--green); }
.status-dot.error   { background: var(--red); }

.job-name { font-size: 0.8rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ─ Main panel ─ */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.main-header {
  padding: 1.5rem 2rem 1rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.main-header h2 { font-size: 1.1rem; font-weight: 600; }

.summary-badges {
  display: flex;
  gap: 0.6rem;
}

.badge {
  padding: 3px 10px;
  border-radius: 20px;
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 700;
}

.badge.pass { background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
.badge.fail { background: rgba(239,68,68,0.15); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
.badge.info { background: rgba(59,130,246,0.15); color: var(--accent); border: 1px solid rgba(59,130,246,0.3); }
.badge.warn { background: rgba(234,179,8,0.15); color: var(--yellow); border: 1px solid rgba(234,179,8,0.3); }

.main-body {
  flex: 1;
  overflow-y: auto;
  padding: 1.5rem 2rem;
}

/* ─ Empty state ─ */
.empty {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  gap: 1rem;
  text-align: center;
}

.empty-icon { font-size: 3rem; opacity: 0.3; }
.empty h3 { font-size: 1rem; font-weight: 500; }
.empty p { font-size: 0.85rem; max-width: 280px; line-height: 1.6; }

/* ─ Spinner ─ */
.spinner-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 200px;
  gap: 1rem;
  color: var(--muted);
  font-size: 0.85rem;
}

.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ─ Stats row ─ */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem 1.2rem;
}

.stat .s-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.4rem; }
.stat .s-val { font-size: 1.8rem; font-weight: 800; }
.stat.green .s-val { color: var(--green); }
.stat.red .s-val { color: var(--red); }
.stat.blue .s-val { color: var(--accent); }
.stat.yellow .s-val { color: var(--yellow); }

/* ─ Steps ─ */
.section-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  margin-bottom: 0.8rem;
}

.steps-list { display: flex; flex-direction: column; gap: 0.5rem; }

.step-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}

.step-card-header {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  padding: 0.7rem 1rem;
  cursor: pointer;
}

.step-card-header:hover { background: rgba(255,255,255,0.02); }

.step-n { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); min-width: 2.5rem; }
.step-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.step-dot.pass { background: var(--green); }
.step-dot.fail { background: var(--red); }

.step-action-tag {
  font-family: var(--mono);
  font-size: 0.65rem;
  padding: 2px 7px;
  border-radius: 3px;
  background: rgba(59,130,246,0.15);
  color: var(--accent);
  text-transform: uppercase;
  flex-shrink: 0;
}

.step-desc { flex: 1; font-size: 0.85rem; color: var(--text); }

.step-card-body {
  display: none;
  padding: 0.6rem 1rem 0.8rem 4.5rem;
  border-top: 1px solid var(--border);
  background: rgba(0,0,0,0.2);
}

.step-card.open .step-card-body { display: block; }

.detail-line { display: flex; gap: 0.6rem; margin-bottom: 0.2rem; font-family: var(--mono); font-size: 0.75rem; }
.detail-line .dk { color: var(--muted); min-width: 5rem; }
.detail-line .dv { color: var(--text); word-break: break-all; }
.detail-line .dv.err { color: var(--red); }

.assertions-block { margin-top: 0.6rem; }
.assertions-block .alabel { font-family: var(--mono); font-size: 0.65rem; color: var(--muted); text-transform: uppercase; margin-bottom: 0.3rem; }
.assert-line { display: flex; align-items: flex-start; gap: 0.5rem; margin-bottom: 0.2rem; font-family: var(--mono); font-size: 0.72rem; }
.assert-line .aicon { flex-shrink: 0; }
.assert-line.pass .aicon { color: var(--green); }
.assert-line.fail .aicon { color: var(--red); }
.assert-line .acode { color: #93c5fd; word-break: break-all; }

/* ─ Error/Debug blocks ─ */
.err-block {
  background: rgba(239,68,68,0.07);
  border: 1px solid rgba(239,68,68,0.2);
  border-radius: 6px;
  padding: 1rem;
  margin-bottom: 1.2rem;
}

.err-block .eb-title { font-family: var(--mono); font-size: 0.7rem; color: var(--red); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem; }
.err-block pre { font-family: var(--mono); font-size: 0.78rem; color: #fca5a5; white-space: pre-wrap; word-break: break-all; }

.debug-block {
  background: rgba(234,179,8,0.07);
  border: 1px solid rgba(234,179,8,0.2);
  border-radius: 6px;
  padding: 1rem;
  margin-bottom: 1.2rem;
}

.debug-block .db-title { font-family: var(--mono); font-size: 0.7rem; color: var(--yellow); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem; }
.debug-block p { font-size: 0.85rem; line-height: 1.7; white-space: pre-wrap; color: #fde68a; }

.report-link {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  color: var(--accent);
  font-size: 0.8rem;
  text-decoration: none;
  font-family: var(--mono);
  margin-top: 0.5rem;
}

.report-link:hover { text-decoration: underline; }

/* ─ Progress bar ─ */
.progress-wrap { margin-bottom: 1.2rem; }
.progress-wrap .prog-label { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); margin-bottom: 0.4rem; }
.progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }
.progress-fill.pass { background: var(--green); }
.progress-fill.fail { background: var(--red); }
</style>
</head>
<body>

<!-- Topbar -->
<header class="topbar">
  <div class="logo">
    <span class="logo-dot"></span>
    AI Web Testing Agent
  </div>
  <span class="topbar-sub">LangGraph · Playwright · Gemini</span>
</header>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-header">
    <h2>New Test Run</h2>

    <div class="form-group">
      <label>Test Name</label>
      <input type="text" id="testName" placeholder="e.g. Login Flow" value="AI Web Test">
    </div>

    <div class="form-group">
      <label>Target URL <span style="color:var(--muted)">(optional)</span></label>
      <input type="text" id="targetUrl" placeholder="https://example.com">
    </div>

    <div class="form-group">
      <label>Natural Language Instructions</label>
      <textarea id="instruction" placeholder="Open https://example.com.
Fill in username 'user@test.com' in the email field.
Click the Login button.
Verify the dashboard title is visible."></textarea>
    </div>

    <div class="form-group">
      <div class="form-toggles">
        <label class="toggle">
          <input type="checkbox" id="headless" checked>
          Headless
        </label>
        <label class="toggle">
          <input type="checkbox" id="llmDebug">
          AI Debug
        </label>
      </div>
    </div>

    <button class="run-btn" id="runBtn" onclick="runTest()">
      ▶ Run Test
    </button>
  </div>

  <div class="job-list">
    <div class="job-list-title">Recent Jobs</div>
    <div id="jobList"></div>
  </div>
</aside>

<!-- Main panel -->
<main class="main">
  <div class="main-header">
    <h2 id="mainTitle">Select or run a test</h2>
    <div class="summary-badges" id="summaryBadges"></div>
  </div>
  <div class="main-body" id="mainBody">
    <div class="empty">
      <div class="empty-icon">🤖</div>
      <h3>No test selected</h3>
      <p>Write natural language instructions and click Run Test to start automated browser testing.</p>
    </div>
  </div>
</main>

<script>
let activeJobId = null;
let pollInterval = null;
let allJobs = [];

async function runTest() {
  const instruction = document.getElementById('instruction').value.trim();
  if (!instruction) { alert('Please enter test instructions.'); return; }

  const payload = {
    instruction,
    test_name:        document.getElementById('testName').value.trim() || 'AI Web Test',
    target_url:       document.getElementById('targetUrl').value.trim(),
    headless:         document.getElementById('headless').checked,
    use_llm_debugging: document.getElementById('llmDebug').checked,
    max_retries: 2
  };

  document.getElementById('runBtn').disabled = true;

  try {
    const r = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await r.json();
    if (data.job_id) {
      allJobs.unshift({ id: data.job_id, status: 'queued', created_at: new Date().toISOString(),
                        name: payload.test_name, final_status: null });
      renderJobList();
      selectJob(data.job_id);
    }
  } catch (e) {
    alert('Error: ' + e.message);
  }

  document.getElementById('runBtn').disabled = false;
}

function selectJob(jobId) {
  activeJobId = jobId;
  document.querySelectorAll('.job-item').forEach(el =>
    el.classList.toggle('active', el.dataset.id === jobId));

  if (pollInterval) clearInterval(pollInterval);
  pollJob(jobId);
  pollInterval = setInterval(() => pollJob(jobId), 2000);
}

async function pollJob(jobId) {
  if (jobId !== activeJobId) return;
  try {
    const r = await fetch(`/api/status/${jobId}`);
    const data = await r.json();

    // update job in list
    const idx = allJobs.findIndex(j => j.id === jobId);
    if (idx >= 0) {
      allJobs[idx].status = data.status;
      allJobs[idx].final_status = data.final_status;
    }
    renderJobList();

    if (data.status === 'running' || data.status === 'queued') {
      renderRunning(data);
    } else {
      clearInterval(pollInterval);
      if (data.status === 'done') renderResult(data);
      else renderError(data);
    }
  } catch (e) {
    console.error(e);
  }
}

function renderJobList() {
  const el = document.getElementById('jobList');
  el.innerHTML = allJobs.map(j => {
    const st = j.final_status
      ? (j.final_status === 'PASS' ? '✓ PASS' : '✗ FAIL')
      : j.status;
    return `
      <div class="job-item ${j.id === activeJobId ? 'active' : ''}" data-id="${j.id}" onclick="selectJob('${j.id}')">
        <div class="job-item-top">
          <span class="job-id">${j.id}</span>
          <span class="status-dot ${j.status}"></span>
        </div>
        <div class="job-name">${j.name || 'AI Web Test'}</div>
      </div>
    `;
  }).join('');
}

function renderRunning(data) {
  document.getElementById('mainTitle').textContent = `Running: ${data.id}`;
  document.getElementById('summaryBadges').innerHTML = `<span class="badge info">⟳ ${data.status.toUpperCase()}</span>`;
  document.getElementById('mainBody').innerHTML = `
    <div class="spinner-wrap">
      <div class="spinner"></div>
      <span>Agent is executing test steps…</span>
    </div>`;
}

function renderResult(data) {
  const s = data.summary || {};
  const total = s.total_steps || 0;
  const passed = s.steps_passed || 0;
  const failed = s.steps_failed || 0;
  const rate = total ? Math.round(passed / total * 100) : 0;
  const isPass = data.final_status === 'PASS';

  document.getElementById('mainTitle').textContent = s.test_name || data.id;
  document.getElementById('summaryBadges').innerHTML = `
    <span class="badge ${isPass ? 'pass' : 'fail'}">${isPass ? '✓ PASS' : '✗ FAIL'}</span>
    <span class="badge info">${s.execution_time || ''}</span>
  `;

  let html = `
    <div class="stats-row">
      <div class="stat blue"><div class="s-label">Total Steps</div><div class="s-val">${total}</div></div>
      <div class="stat green"><div class="s-label">Passed</div><div class="s-val">${passed}</div></div>
      <div class="stat red"><div class="s-label">Failed</div><div class="s-val">${failed}</div></div>
      <div class="stat yellow"><div class="s-label">Pass Rate</div><div class="s-val">${rate}%</div></div>
    </div>

    <div class="progress-wrap">
      <div class="prog-label"><span>Progress</span><span>${passed}/${total}</span></div>
      <div class="progress-bar">
        <div class="progress-fill ${isPass ? 'pass' : 'fail'}" style="width:${rate}%"></div>
      </div>
    </div>
  `;

  // Error block
  if (data.error || (s.step_results || []).some(r => r.status === 'FAIL')) {
    const err = data.error || (s.step_results.find(r => r.status === 'FAIL') || {}).error || '';
    html += `<div class="err-block"><div class="eb-title">✗ Test Failure</div><pre>${escHtml(err)}</pre></div>`;
  }

  // Debug block
  if (s.debug_suggestion) {
    html += `<div class="debug-block"><div class="db-title">🤖 AI Debug Suggestions</div><p>${escHtml(s.debug_suggestion)}</p></div>`;
  }

  // Report link
  if (s.report_paths && s.report_paths.html_path) {
    const fname = s.report_paths.html_path.split('/').pop().split('\\').pop();
    html += `<a class="report-link" href="/reports/${fname}" target="_blank">📄 Open Full HTML Report ↗</a>`;
  }

  // Steps
  html += `<div class="section-label" style="margin-top:1.5rem">Step Results</div><div class="steps-list">`;
  (s.step_results || []).forEach(step => {
    const st = step.status === 'PASS' ? 'pass' : 'fail';
    const assertHtml = (step.assertion_details || []).map(d => {
      const ac = d.status === 'PASS' ? 'pass' : 'fail';
      const ic = d.status === 'PASS' ? '✓' : '✗';
      const errLine = d.error ? `<div style="color:var(--red);font-size:0.7rem;margin-left:1rem">↳ ${escHtml(d.error)}</div>` : '';
      return `<div class="assert-line ${ac}"><span class="aicon">${ic}</span><div><span class="acode">${escHtml(d.assertion)}</span>${errLine}</div></div>`;
    }).join('');

    html += `
      <div class="step-card" id="step-${step.step_number}">
        <div class="step-card-header" onclick="this.closest('.step-card').classList.toggle('open')">
          <span class="step-n">#${String(step.step_number).padStart(2,'0')}</span>
          <span class="step-dot ${st}"></span>
          <span class="step-action-tag">${step.action || ''}</span>
          <span class="step-desc">${escHtml(step.description || '')}</span>
        </div>
        <div class="step-card-body">
          ${step.target ? `<div class="detail-line"><span class="dk">Target</span><span class="dv">${escHtml(step.target)}</span></div>` : ''}
          ${step.value  ? `<div class="detail-line"><span class="dk">Value</span><span class="dv">${escHtml(step.value)}</span></div>`  : ''}
          ${step.error  ? `<div class="detail-line"><span class="dk">Error</span><span class="dv err">${escHtml(step.error)}</span></div>` : ''}
          ${assertHtml ? `<div class="assertions-block"><div class="alabel">Assertions</div>${assertHtml}</div>` : ''}
        </div>
      </div>`;
  });

  html += '</div>';
  document.getElementById('mainBody').innerHTML = html;
}

function renderError(data) {
  document.getElementById('mainTitle').textContent = `Error: ${data.id}`;
  document.getElementById('summaryBadges').innerHTML = `<span class="badge fail">✗ ERROR</span>`;
  document.getElementById('mainBody').innerHTML = `
    <div class="err-block">
      <div class="eb-title">Agent Error</div>
      <pre>${escHtml(data.error || 'Unknown error')}</pre>
    </div>`;
}

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Load existing jobs on page open
async function loadJobs() {
  try {
